name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Mise en forme
        run: uv run ruff format --check .
      - name: Typage
        run: uv run mypy
      - name: Tests et couverture
        run: uv run pytest --cov
